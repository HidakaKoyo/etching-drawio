name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one draw.io Desktop the smoke job is allowed to see. Pinned so that an
  # upstream release cannot change what the Phase 1d gate was passed against.
  DRAWIO_VERSION: 31.3.2

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # contracts/environment.md §3 declares 3.9 as the floor, so one leg of the
      # matrix runs on exactly 3.9 to keep the claim honest. macOS keeps the
      # runner's own python3, which is well above the floor.
      - name: Pin python to the declared floor
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      # contracts/environment.md §3: python3 >= 3.9, standard library only.
      # No pip, no uv, so a dependency that crept into the tool would fail here
      # rather than pass.
      - name: Report the runtime
        run: |
          python3 --version
          bash --version | head -1

      # The version is edited in plugin.json and copied into marketplace.json
      # and skills/etching/VERSION by scripts/build-release.py. --check is what
      # keeps a hand-edited copy from shipping (docs/PLAN.md §9).
      - name: Release version copies
        run: python3 scripts/build-release.py --check -v

      - name: Contract fixtures
        run: python3 scripts/validate-contracts.py

      - name: Vendor snapshot
        run: python3 scripts/verify-vendor.py

      # ETCH_CLI points both suites at the new CLI. Without it the invariant
      # suite falls back to the legacy wrapper, which lives in the Koyo-HQ vault
      # and does not exist here. Export cases run against the bash stub the
      # harness puts in front of PATH; real draw.io export is Phase 1d.
      - name: Characterization - invariants
        env:
          ETCH_CLI: ${{ github.workspace }}/bin/etch
        run: python3 tests/characterization/test_invariants.py

      - name: Characterization - migration
        env:
          ETCH_CLI: ${{ github.workspace }}/bin/etch
        run: python3 tests/characterization/test_migration.py

  # The clean-install procedure of contracts/environment.md §6, both
  # distribution layouts, on both operating systems. This is where the Linux
  # half of the loop is exercised: Phase 2 dogfooding only ever ran on macOS.
  acceptance:
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Pin python to the declared floor
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      # No draw.io install here on purpose: the suite stubs the exporter,
      # because what it tests is the install layout, not the export.
      - name: Distribution layouts
        run: python3 tests/acceptance/test_distribution.py -v

  # Everywhere else draw.io is a bash stub. Here the real Desktop build runs, so
  # this job is the only evidence that export works at all; a failure here is a
  # CI failure (contracts/environment.md §6 step 6). It does not depend on the
  # test job: the two answer different questions and should fail separately.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # The .deb lands drawio on PATH *and* at /usr/bin/drawio, so both the PATH
      # branch and the Linux-defaults branch of the resolution order are real
      # here. xvfb is the virtual display of contracts/environment.md §4.2.
      - name: Install draw.io Desktop (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o /tmp/drawio.deb \
            "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/drawio-amd64-${DRAWIO_VERSION}.deb"
          sudo apt-get update
          sudo apt-get install -y /tmp/drawio.deb xvfb

      # The universal .dmg is copied to /Applications, which is exactly the
      # bundle path the resolution order looks for, and leaves nothing named
      # drawio on PATH - so the fallback case has something to fall back to.
      - name: Install draw.io Desktop (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL --retry 3 -o /tmp/drawio.dmg \
            "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/draw.io-universal-${DRAWIO_VERSION}.dmg"
          hdiutil attach -nobrowse -quiet /tmp/drawio.dmg -mountpoint /Volumes/drawio
          sudo cp -R "/Volumes/drawio/draw.io.app" /Applications/
          hdiutil detach -quiet /Volumes/drawio

      # The suite exits 0 when draw.io is absent, which is right for a laptop and
      # wrong here: after the install step above, absence means the install did
      # not take. So a skipped suite is turned back into a failure.
      # EXPECT_DRAWIO_VERSION makes the pin load-bearing: the suite fails if the
      # installed build, or the version the receipt records, is anything other
      # than what this workflow installed.
      - name: Real export smoke
        env:
          ETCH_CLI: ${{ github.workspace }}/bin/etch
          EXPECT_DRAWIO_VERSION: ${{ env.DRAWIO_VERSION }}
          DISPLAY_WRAPPER: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
        run: |
          set -o pipefail
          $DISPLAY_WRAPPER python3 tests/smoke/test_real_export.py -v | tee /tmp/smoke.log
          if grep -q "draw.io Desktop was not found" /tmp/smoke.log; then
            echo "the install step did not put draw.io where resolution looks" >&2
            exit 1
          fi

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # contracts/environment.md §2: bash 3.2 compatible. ShellCheck ships with
      # the ubuntu runner image.
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --shell=bash --severity=style bin/etch
